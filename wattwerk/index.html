<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wattwerk</title>
<meta name="theme-color" content="#0A0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0A0E13;color:#EAF0F5;font:16px/1.4 system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
img{width:96px;height:96px;border-radius:24px}
p{margin:0;color:#8C9AA8}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;background:#FF6A3D;color:#0A0E13;font-weight:600;text-decoration:none}
</style></head>
<body><main>
<img src="icon-192.png" alt="">
<p id="msg">Wattwerk wird geöffnet …</p>
<a id="go" href="https://claude.ai/artifact/JXhapPkw8TwegLVZTmLyfU">Wattwerk öffnen</a>
</main>
<script>
const U=document.getElementById("go").href;
if(!/[?&]stay\b/.test(location.search))setTimeout(()=>location.replace(U),120);
addEventListener("pageshow",e=>{if(e.persisted)document.getElementById("msg").textContent="Tippe auf den Knopf, um Wattwerk zu öffnen."});
</script>
</body></html>
